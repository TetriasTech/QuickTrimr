# Supabase CLI 2.98.1. Local infrastructure defaults, not product policy.
# https://supabase.com/docs/guides/local-development/cli/config
# Separate identity/ports from myClean and other default-port Supabase projects.
project_id = "quicktrimr"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

# P0-T12 foundation fixtures; privileged local reset only. Never use remote reset.
[db.seed]
enabled = true
sql_paths = ["./seed/foundation.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 55324

[storage]
enabled = true

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"

[auth.email]
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirm your QuickTrimr email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your QuickTrimr password"
content_path = "./supabase/templates/recovery.html"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8084
deno_version = 2

[analytics]
enabled = false

[functions.workspace-contract]
enabled = true
verify_jwt = true
entrypoint = "./functions/workspace-contract/serve.ts"

[functions.create-or-sync-profile]
enabled = true
verify_jwt = true

[functions.complete-client-profile]
enabled = true
verify_jwt = true

[functions.manage-client-addresses]
verify_jwt = true

[functions.complete-barber-profile]
verify_jwt = true

[functions.create-stripe-connect-onboarding-link]
verify_jwt = true

[functions.refresh-stripe-connect-status]
verify_jwt = true

[functions.stripe-webhook]
# Provider ingress authenticates Stripe-Signature on original bytes.
verify_jwt = false

[functions.create-service-category]
verify_jwt = true

[functions.update-service-category]
verify_jwt = true

[functions.archive-service-category]
verify_jwt = true

[functions.upsert-barber-service]
verify_jwt = true

[functions.archive-barber-service]
verify_jwt = true

[functions.get-public-barber-profile]
verify_jwt = true

[functions.start-available-now-session]
verify_jwt = true

[functions.update-available-now-session]
verify_jwt = true

[functions.stop-available-now-session]
verify_jwt = true

[functions.auto-disable-unresponsive-barber]
verify_jwt = true

[functions.expire-booking-request]
verify_jwt = true

[functions.create-payment-authorisation]
verify_jwt = true

[functions.search-available-now-barbers]
verify_jwt = true

[functions.get-discovery-filters]
verify_jwt = true

[functions.create-booking-request]
verify_jwt = true

[functions.accept-booking-request]
verify_jwt = true

[functions.decline-booking-request]
verify_jwt = true
