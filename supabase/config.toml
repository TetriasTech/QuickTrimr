# Supabase CLI 2.98.1. Local infrastructure defaults, not product policy.
# https://supabase.com/docs/guides/local-development/cli/config
# Separate identity/ports from myClean and other default-port Supabase projects.
project_id = "quicktrimr"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

# P0-T12 foundation fixtures; privileged local reset only. Never use remote reset.
[db.seed]
enabled = true
sql_paths = ["./seed/foundation.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 55324

[storage]
enabled = true

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8084
deno_version = 2

[analytics]
enabled = false

[functions.workspace-contract]
enabled = true
verify_jwt = true
entrypoint = "./functions/workspace-contract/serve.ts"
