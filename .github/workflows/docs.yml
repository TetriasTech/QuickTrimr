name: Docs

# Keeps QUICKTRIMR_KNOWLEDGE_BASE.md and QUICKTRIMR_BACKLOG_README.md consistent.
#
# The split matters:
#   - PRs VALIDATE the ticket graph and decision examples. They never touch sections 8 and 9.
#   - main REGENERATES sections 8 and 9 after merge and proposes a reviewed PR.
#
# That is deliberate. If branches regenerated the indexes, every PR would conflict in
# those two sections — which is the one real cost of keeping the backlog in a single
# file. Only the automation branch contains regenerated output (RULE-DEV-CI).

on:
  pull_request:
    paths:
      - 'QUICKTRIMR_*.md'
      - 'scripts/jira/**'
      - 'scripts/decisions.test.mjs'
      - 'docs/decisions/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'QUICKTRIMR_*.md'
      - 'scripts/jira/**'
      - 'scripts/decisions.test.mjs'
      - 'docs/decisions/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate ticket graph and decisions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      # Catches: dangling dependsOn/affects, dependency cycles, later-phase
      # dependencies, owners that aren't exactly Tony or Andrew, knowledgeBase
      # citations of rules that don't exist, and tickets citing a reserved rule
      # without depending on the decision ticket that writes it.
      - name: Validate
        run: node scripts/jira/generate-indexes.mjs --check

      - name: Check decision examples
        run: node --test scripts/decisions.test.mjs

  regenerate:
    name: Propose regenerated indexes
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: docs-generated-indexes
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Always start from the latest main, including after a queued run.
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate the checked-out main snapshot
        run: node scripts/jira/generate-indexes.mjs --check

      - name: Regenerate sections 8 and 9
        run: node scripts/jira/generate-indexes.mjs

      # Reuses one bot-owned branch; unchanged output creates no new PR.
      # GITHUB_TOKEN PR workflows require human approval to run. Never bypass CI.
      - name: Open or update the generated-index PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          add-paths: QUICKTRIMR_BACKLOG_README.md
          branch: codex/generated-indexes
          base: main
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: 'docs: regenerate backlog indexes'
          title: 'docs: refresh generated backlog indexes'
          body: |
            Generated from main after merge, per RULE-DEV-CI.

            A maintainer must select **Approve workflows to run** if GitHub requests it,
            wait for **CI required**, and obtain one approving human review before merge.
            This PR has no automatic approval, merge, or branch-protection bypass.
            Do not edit this bot-managed branch manually.
